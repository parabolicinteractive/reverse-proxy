name: reverse-proxy
services:
    traefik:
        # v3.6+ avoids Docker API 1.24, rejected by current daemons.
        image: traefik:v3.6
        container_name: traefik
        restart: unless-stopped
        ports:
            # Host-only access, including routes to project dashboards.
            - "127.0.0.1:80:80"
            # HTTPS entrypoint. Plain HTTP keeps working; nothing redirects.
            - "127.0.0.1:443:443"
            # Dashboard: http://localhost:8080
            - "127.0.0.1:8080:8080"
        volumes:
            - ./traefik.yaml:/etc/traefik/traefik.yaml:ro
            # CA key is not mounted here, but Docker socket access can read it.
            # A :ro socket mount does not restrict API operations.
            - dynamic:/etc/traefik/dynamic:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
        networks:
            - reverse-proxy

    tls:
        # Issues per-host .test certificates. The machine-specific CA and
        # certificates stay in volumes; bin/trust exports the public CA.
        build: ./tls
        container_name: reverse-proxy-tls
        restart: unless-stopped
        volumes:
            - certs:/certs
            - dynamic:/dynamic
            - /var/run/docker.sock:/var/run/docker.sock:ro
        networks:
            - reverse-proxy

    dns:
        # Containerized wildcard DNS; no host dnsmasq installation.
        build: ./dnsmasq
        container_name: reverse-proxy-dns
        restart: unless-stopped
        ports:
            # Bound to loopback only. Never expose a resolver on the LAN.
            - "127.0.0.1:53:53/udp"
            - "127.0.0.1:53:53/tcp"
        volumes:
            - ./dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf:ro
        networks:
            - reverse-proxy

    pgbouncer:
        # One Postgres port for all projects, routed by database name.
        build: ./pgbouncer
        container_name: reverse-proxy-pgbouncer
        restart: unless-stopped
        ports:
            # Accepts any password; the loopback binding is the security boundary.
            - "127.0.0.1:6432:6432"
        volumes:
            - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
            - pgbouncer-generated:/etc/pgbouncer/generated:ro
        # Wait for pgbouncer-gen's required include file before starting.
        entrypoint:
            - sh
            - -c
            - 'until [ -f /etc/pgbouncer/generated/databases.ini ]; do sleep 0.2; done; exec pgbouncer /etc/pgbouncer/pgbouncer.ini'
        depends_on:
            - pgbouncer-gen
        networks:
            - reverse-proxy

    pgbouncer-gen:
        # Updates database routes from Docker events and reloads pgbouncer.
        image: nginxproxy/docker-gen:0.17.2
        container_name: reverse-proxy-pgbouncer-gen
        restart: unless-stopped
        command:
            - -watch
            - -notify-sighup
            - reverse-proxy-pgbouncer
            - /etc/docker-gen/databases.tmpl
            - /etc/pgbouncer/generated/databases.ini
        volumes:
            # docker-gen looks for the socket here, not /var/run.
            - /var/run/docker.sock:/tmp/docker.sock:ro
            - ./pgbouncer/databases.tmpl:/etc/docker-gen/databases.tmpl:ro
            - pgbouncer-generated:/etc/pgbouncer/generated
        networks:
            - reverse-proxy

volumes:
    # Carries the routing table from pgbouncer-gen to pgbouncer.
    pgbouncer-generated:
    # Only tls mounts the CA. External so down -v preserves device trust.
    # Create once: docker volume create reverse-proxy-certs
    certs:
        external: true
        name: reverse-proxy-certs
    # Per-host certificates shared with Traefik; regenerated if removed.
    dynamic:

networks:
    reverse-proxy:
        # Created here. Every other project declares it external and joins.
        name: reverse-proxy
