name: reverse-proxy
services:
    traefik:
        # v3.6+ required: earlier versions pin Docker API 1.24, which
        # current daemons reject.
        image: traefik:v3.6
        container_name: traefik
        restart: unless-stopped
        ports:
            # HTTP entrypoint for every *.test dev site
            - "80:80"
            # HTTPS entrypoint. Plain HTTP keeps working; nothing redirects.
            - "443:443"
            # Dashboard: http://localhost:8080
            - "8080:8080"
        volumes:
            - ./traefik.yaml:/etc/traefik/traefik.yaml:ro
            # Read only, and the authority is not mounted here, so the
            # signing key is not on Traefik's filesystem. That is a smaller
            # claim than isolation: the Docker socket below reaches the whole
            # daemon, and :ro on a socket does not make the API read only.
            - dynamic:/etc/traefik/dynamic:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
        networks:
            - reverse-proxy

    tls:
        # Issues one certificate per .test hostname Traefik routes, one file
        # per hostname. Both volumes are runtime state, not repository
        # content: the authority is generated here, is particular to this
        # machine, and its key never touches the working tree. bin/trust
        # reads it out of this container.
        build: ./tls
        container_name: reverse-proxy-tls
        restart: unless-stopped
        volumes:
            - certs:/certs
            - dynamic:/dynamic
            - /var/run/docker.sock:/var/run/docker.sock:ro
        networks:
            - reverse-proxy

    dns:
        # Wildcard DNS, so a new site needs no /etc/hosts entry. Runs in a
        # container so nobody installs dnsmasq, and so port 53 needs no
        # elevated permission on the host.
        build: ./dnsmasq
        container_name: reverse-proxy-dns
        restart: unless-stopped
        ports:
            # Bound to loopback only. Never expose a resolver on the LAN.
            - "127.0.0.1:53:53/udp"
            - "127.0.0.1:53:53/tcp"
        volumes:
            - ./dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf:ro
        networks:
            - reverse-proxy

    pgbouncer:
        # Postgres front door. Routes by database name, so one host port
        # reaches every project's database.
        build: ./pgbouncer
        container_name: reverse-proxy-pgbouncer
        restart: unless-stopped
        ports:
            # Loopback only. Any password is accepted, so this binding is
            # the security boundary.
            - "127.0.0.1:6432:6432"
        volumes:
            - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
            - pgbouncer-generated:/etc/pgbouncer/generated:ro
        # A missing include is fatal to pgbouncer, and pgbouncer-gen writes
        # it. Wait for the file rather than crash-loop.
        entrypoint:
            - sh
            - -c
            - 'until [ -f /etc/pgbouncer/generated/databases.ini ]; do sleep 0.2; done; exec pgbouncer /etc/pgbouncer/pgbouncer.ini'
        depends_on:
            - pgbouncer-gen
        networks:
            - reverse-proxy

    pgbouncer-gen:
        # Rewrites pgbouncer's routing table from container labels on every
        # Docker event, then signals pgbouncer to reload.
        image: nginxproxy/docker-gen:0.17.2
        container_name: reverse-proxy-pgbouncer-gen
        restart: unless-stopped
        command:
            - -watch
            - -notify-sighup
            - reverse-proxy-pgbouncer
            - /etc/docker-gen/databases.tmpl
            - /etc/pgbouncer/generated/databases.ini
        volumes:
            # docker-gen looks for the socket here, not /var/run.
            - /var/run/docker.sock:/tmp/docker.sock:ro
            - ./pgbouncer/databases.tmpl:/etc/docker-gen/databases.tmpl:ro
            - pgbouncer-generated:/etc/pgbouncer/generated
        networks:
            - reverse-proxy

volumes:
    # Carries the routing table from pgbouncer-gen to pgbouncer.
    pgbouncer-generated:
    # The certificate authority. Only the tls service mounts it. Declared
    # external so `docker compose down -v` cannot take it: losing it means
    # every certificate is reissued under an authority this machine has never
    # heard of, and every .test site warns until bin/trust runs again.
    # Create it once: docker volume create reverse-proxy-certs
    certs:
        external: true
        name: reverse-proxy-certs
    # One certificate per hostname, written by tls and read by traefik. Left
    # managed: losing it costs ten seconds of reissue and nothing else.
    dynamic:

networks:
    reverse-proxy:
        # Created here. Every other project declares it external and joins.
        name: reverse-proxy
