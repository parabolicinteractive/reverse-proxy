name: chronicle-proxy
services:
    traefik:
        # v3.6+ required: earlier versions pin Docker API 1.24, which
        # current daemons reject.
        image: traefik:v3.6
        container_name: traefik
        restart: unless-stopped
        ports:
            # HTTP entrypoint for every *.test dev site
            - "80:80"
            # Dashboard: http://localhost:8080
            - "8080:8080"
        volumes:
            - ./traefik.yaml:/etc/traefik/traefik.yaml:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
        networks:
            - reverse-proxy

    dns:
        # Wildcard DNS, so a new site needs no /etc/hosts entry. Runs in a
        # container so nobody installs dnsmasq, and so port 53 needs no
        # elevated permission on the host.
        build: ./dnsmasq
        container_name: chronicle-dns
        restart: unless-stopped
        ports:
            # Bound to loopback only. Never expose a resolver on the LAN.
            - "127.0.0.1:53:53/udp"
            - "127.0.0.1:53:53/tcp"
        volumes:
            - ./dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf:ro
        networks:
            - reverse-proxy

    pgbouncer:
        # Postgres front door. Routes by database name, so one host port
        # reaches every project's database.
        build: ./pgbouncer
        container_name: chronicle-pgbouncer
        restart: unless-stopped
        ports:
            # Loopback only. Any password is accepted, so this binding is
            # the security boundary.
            - "127.0.0.1:6432:6432"
        volumes:
            - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
            - pgbouncer-generated:/etc/pgbouncer/generated:ro
        # A missing include is fatal to pgbouncer, and pgbouncer-gen writes
        # it. Wait for the file rather than crash-loop.
        entrypoint:
            - sh
            - -c
            - 'until [ -f /etc/pgbouncer/generated/databases.ini ]; do sleep 0.2; done; exec pgbouncer /etc/pgbouncer/pgbouncer.ini'
        depends_on:
            - pgbouncer-gen
        networks:
            - reverse-proxy

    pgbouncer-gen:
        # Rewrites pgbouncer's routing table from container labels on every
        # Docker event, then signals pgbouncer to reload.
        image: nginxproxy/docker-gen:0.17.2
        container_name: chronicle-pgbouncer-gen
        restart: unless-stopped
        command:
            - -watch
            - -notify-sighup
            - chronicle-pgbouncer
            - /etc/docker-gen/databases.tmpl
            - /etc/pgbouncer/generated/databases.ini
        volumes:
            # docker-gen looks for the socket here, not /var/run.
            - /var/run/docker.sock:/tmp/docker.sock:ro
            - ./pgbouncer/databases.tmpl:/etc/docker-gen/databases.tmpl:ro
            - pgbouncer-generated:/etc/pgbouncer/generated
        networks:
            - reverse-proxy

volumes:
    # Carries the routing table from pgbouncer-gen to pgbouncer.
    pgbouncer-generated:

networks:
    reverse-proxy:
        # Created here. Every other project declares it external and joins.
        name: reverse-proxy
