name: chronicle-proxy
services:
    traefik:
        # v3.6+ required: earlier versions pin Docker API 1.24, which
        # OrbStack's daemon rejects (min 1.40)
        image: traefik:v3.6
        container_name: traefik
        restart: unless-stopped
        ports:
            # HTTP entrypoint for every *.test dev site
            - "80:80"
            # Dashboard: http://localhost:8080
            - "8080:8080"
        volumes:
            - ./traefik.yaml:/etc/traefik/traefik.yaml:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
        networks:
            - reverse-proxy

    dns:
        # Wildcard DNS, so a new site needs no /etc/hosts entry. Runs in a
        # container specifically so nobody has to install dnsmasq on their
        # machine. Root inside the container owns port 53, which is also why
        # this needs no elevated permission on the host.
        build: ./dnsmasq
        container_name: chronicle-dns
        restart: unless-stopped
        ports:
            # Bound to loopback only. Never expose a resolver on the LAN.
            - "127.0.0.1:53:53/udp"
            - "127.0.0.1:53:53/tcp"
        volumes:
            - ./dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf:ro
        networks:
            - reverse-proxy

    pgbouncer:
        # Postgres front door. A client sends the database name in its startup
        # packet, and pgbouncer forwards to whichever container serves that
        # name, so one host port reaches every project's database. Traefik
        # routes HTTP by Host header; this routes Postgres by database name,
        # which is the only field the protocol offers before connecting.
        build: ./pgbouncer
        container_name: chronicle-pgbouncer
        restart: unless-stopped
        ports:
            # Loopback only, like the resolver. This accepts any password, so
            # the port binding is the security boundary.
            - "127.0.0.1:6432:6432"
        volumes:
            - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
            - pgbouncer-generated:/etc/pgbouncer/generated:ro
        # The routing table is written by pgbouncer-gen, which may not have
        # produced it yet on a cold start. pgbouncer treats a missing include
        # as fatal, so wait for it rather than crash-loop.
        entrypoint:
            - sh
            - -c
            - 'until [ -f /etc/pgbouncer/generated/databases.ini ]; do sleep 0.2; done; exec pgbouncer /etc/pgbouncer/pgbouncer.ini'
        depends_on:
            - pgbouncer-gen
        networks:
            - reverse-proxy

    pgbouncer-gen:
        # Watches Docker events and rewrites pgbouncer's routing table from
        # container labels, then signals pgbouncer to reload. This is what
        # makes a project self-registering: it declares one label and appears,
        # the same way traefik.enable exposes an HTTP service.
        image: nginxproxy/docker-gen:0.17.2
        container_name: chronicle-pgbouncer-gen
        restart: unless-stopped
        command:
            - -watch
            - -notify-sighup
            - chronicle-pgbouncer
            - /etc/docker-gen/databases.tmpl
            - /etc/pgbouncer/generated/databases.ini
        volumes:
            # docker-gen looks here by default, not /var/run.
            - /var/run/docker.sock:/tmp/docker.sock:ro
            - ./pgbouncer/databases.tmpl:/etc/docker-gen/databases.tmpl:ro
            - pgbouncer-generated:/etc/pgbouncer/generated
        networks:
            - reverse-proxy

volumes:
    # Carries the generated routing table from pgbouncer-gen to pgbouncer.
    pgbouncer-generated:

networks:
    reverse-proxy:
        # Not external here: `docker compose up` in THIS project creates the
        # network; every other project declares it external and joins it.
        name: reverse-proxy
