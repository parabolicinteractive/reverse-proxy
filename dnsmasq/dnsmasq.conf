# Wildcard DNS for local development.
#
# Every name under a listed TLD resolves to 127.0.0.1, where Traefik routes it
# to the right container by Host header. Add a TLD here and any number of
# hostnames under it work immediately, with no hosts-file entry per site.
#
# .test is reserved for exactly this purpose by RFC 6761 section 6.2
# (Special-Use Domain Names, February 2013). Registries are forbidden from
# granting registrations under it, so it can never collide with a real domain.
#
# Deliberately not used:
#   .local  Reserved for Multicast DNS by RFC 6762 and handled by mDNSResponder
#           on macOS. Claiming it breaks Bonjour discovery, breaks OrbStack's
#           *.orb.local container addresses, and adds a five second timeout to
#           every lookup that misses.
#   .dev    A real gTLD, owned by Google and HSTS-preloaded, so browsers force
#           HTTPS on every name under it.
#   .lb     A real country-code TLD, delegated to Lebanon. Any two-letter TLD is
#           either a live ccTLD already or a candidate to become one.
#   .localhost
#           Handled by individual programs rather than by the operating system.
#           Browsers and curl resolve subdomains of it, getaddrinfo on macOS
#           does not, so ping, Python, Node and Go fail on the same hostname a
#           browser opens. Needs no setup and works for roughly half the tools
#           that will use it.
address=/test/127.0.0.1

# No listen-address is set, so dnsmasq answers on every interface inside the
# container. The published port in docker-compose.yaml is the security
# boundary: it exposes this on 127.0.0.1 only. Setting listen-address to the
# container's loopback leaves the published port unreachable, and setting it to
# 0.0.0.0 is read as a literal address that no query matches; either way the
# resolver reports a clean start and answers nothing.

# Send logs to stdout so `docker logs` shows them. Without this dnsmasq writes
# to a syslog that does not exist in the container and startup errors vanish.
log-facility=-

# Forward anything that is not one of the TLDs above. This matters on Windows,
# where there is no per-suffix resolver mechanism as convenient as macOS
# /etc/resolver, and the practical setup is to point the whole system at this
# resolver. Without upstreams that configuration would break all other DNS.
no-resolv
server=1.1.1.1
server=8.8.8.8

# Do not forward names with no dot, and do not forward reverse lookups for
# private address ranges. Both are noise that upstream resolvers cannot answer.
domain-needed
bogus-priv
