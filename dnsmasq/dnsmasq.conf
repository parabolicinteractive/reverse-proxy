# Wildcard DNS for local development. Every name under a listed TLD resolves
# to 127.0.0.1, where Traefik routes it by Host header.
#
# .test is reserved for this by RFC 6761 section 6.2, so it can never collide
# with a real domain. Do not add .local (reserved for Multicast DNS, and
# claiming it breaks Bonjour), .dev (a real gTLD, HSTS-preloaded), .localhost
# (resolved by browsers but not by getaddrinfo, so CLI tools fail on names a
# browser opens), or any two-letter TLD (all are country codes).
address=/test/127.0.0.1

# listen-address is deliberately unset: the published port in
# docker-compose.yaml is the security boundary. Setting it to the container's
# loopback makes the published port unreachable, and 0.0.0.0 is read as a
# literal address no query matches. Either way the resolver starts cleanly and
# answers nothing.

# Log to stdout. Without this dnsmasq writes to a syslog the container does
# not have and startup errors vanish.
log-facility=-

# Forward anything not matched above. Windows has no per-suffix resolver
# mechanism, so the practical setup there points the whole system here; these
# upstreams are what keep the rest of DNS working.
no-resolv
server=1.1.1.1
server=8.8.8.8

# Drop noise upstream resolvers cannot answer.
domain-needed
bogus-priv
