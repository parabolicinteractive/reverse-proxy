# Route .test to local Traefik. Reserved by RFC 6761 section 6.2.
# Avoid .local (mDNS), .dev (public, HSTS), two-letter TLDs (country codes),
# and .localhost (inconsistent system resolver support).
address=/test/127.0.0.1

# Leave listen-address unset; Compose restricts access to host loopback.
# Container loopback is unreachable through published ports; dnsmasq treats
# 0.0.0.0 as a literal address, not a wildcard.

# Log to stderr; the container has no syslog.
log-facility=-

# Forward other domains for hosts using this as their primary resolver.
no-resolv
server=1.1.1.1
server=8.8.8.8

# Drop noise upstream resolvers cannot answer.
domain-needed
bogus-priv
