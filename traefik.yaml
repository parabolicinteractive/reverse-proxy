# Traefik static configuration
api:
    dashboard: true
    # Dashboard served plain on :8080. Local dev only, never expose this
    # pattern on a real server.
    insecure: true

entryPoints:
    web:
        address: ":80"
    websecure:
        address: ":443"
        http:
            # A router with no entryPoints of its own is attached to every
            # entryPoint, so a site gets HTTPS without changing a label.
            tls: {}

providers:
    file:
        # The certificate, written by the tls service. Watched by default, so
        # a reissue is picked up without a restart.
        directory: /etc/traefik/dynamic
    docker:
        # Opt-in: a container is only routed if it sets traefik.enable=true
        exposedByDefault: false
        # Talk to containers over the shared reverse-proxy network
        network: reverse-proxy
        # A container that enables Traefik but sets no rule gets
        # <service>.<project>.test derived from its compose labels.
        defaultRule: Host(`{{ index .Labels "com.docker.compose.service" }}.{{ index .Labels "com.docker.compose.project" }}.test`)

log:
    level: INFO
