# Traefik static configuration
api:
    dashboard: true
    # Unauthenticated dashboard on :8080. Local development only.
    insecure: true

entryPoints:
    web:
        address: ":80"
    websecure:
        address: ":443"
        http:
            # Routers without explicit entryPoints also receive HTTPS.
            tls: {}

providers:
    file:
        # Watch certificates written by tls; updates need no restart.
        directory: /etc/traefik/dynamic
    docker:
        # Opt-in: a container is only routed if it sets traefik.enable=true
        exposedByDefault: false
        # Talk to containers over the shared reverse-proxy network
        network: reverse-proxy
        # A container that enables Traefik but sets no rule gets
        # <service>.<project>.test derived from its compose labels.
        defaultRule: Host(`{{ index .Labels "com.docker.compose.service" }}.{{ index .Labels "com.docker.compose.project" }}.test`)

log:
    level: INFO
