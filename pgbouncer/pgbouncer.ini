; Route by database name using the table generated by docker-gen.

%include /etc/pgbouncer/generated/databases.ini

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; Accept any client credentials; use the generated upstream credentials.
; The loopback port binding is the security boundary. Never expose it to the LAN.
auth_type = any

; Session pooling preserves prepared statements, temporary tables and LISTEN/NOTIFY.
pool_mode = session

max_client_conn = 200
default_pool_size = 20

; Clients send these; pgbouncer rejects the connection without them listed.
ignore_startup_parameters = extra_float_digits,options,search_path,application_name

; Empty means stderr, so `docker logs` shows it.
logfile =
pidfile =
