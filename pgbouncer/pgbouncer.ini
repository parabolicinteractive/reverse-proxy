; Postgres front door for local development.
;
; A Postgres client sends the database name in its startup packet, and that is
; the only routing information available before the connection is established.
; pgbouncer reads it and forwards to whichever container serves that name, so
; every project's database is reachable through one host port. It is the same
; idea as routing HTTP by Host header, using the one field Postgres offers.
;
; The project list is generated by docker-gen from container labels and lives
; on a volume, so this repository names no project it serves and no file here
; is edited when one is added.

%include /etc/pgbouncer/generated/databases.ini

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; The username and password a client sends are ignored: every entry in
; databases.ini carries the credentials for its own upstream, which keeps that
; file the single place a project is configured. The security boundary is the
; published port, bound to loopback in docker-compose.yaml exactly as the
; resolver is. Never publish this on a routable interface.
auth_type = any

; Session pooling pins a connection for its whole session, so prepared
; statements, temporary tables, LISTEN/NOTIFY and the rest behave the way a
; GUI client expects. Transaction pooling breaks them.
pool_mode = session

max_client_conn = 200
default_pool_size = 20

; Clients send settings pgbouncer does not recognise and would otherwise
; refuse the connection over.
ignore_startup_parameters = extra_float_digits,options,search_path,application_name

; Empty means stderr, so `docker logs` shows it.
logfile =
pidfile =
