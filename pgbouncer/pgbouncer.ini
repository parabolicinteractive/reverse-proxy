; Postgres front door. Routes by the database name a client sends in its
; startup packet, so one host port reaches every project's database.
;
; The routing table is generated by docker-gen from container labels.

%include /etc/pgbouncer/generated/databases.ini

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; The username and password a client sends are ignored; the routing table
; carries the real credentials. The published port is bound to loopback in
; docker-compose.yaml, and that binding is the security boundary. Never
; publish this on a routable interface.
auth_type = any

; Session pooling keeps prepared statements, temporary tables and
; LISTEN/NOTIFY working. Transaction pooling breaks them.
pool_mode = session

max_client_conn = 200
default_pool_size = 20

; Clients send these; pgbouncer rejects the connection without them listed.
ignore_startup_parameters = extra_float_digits,options,search_path,application_name

; Empty means stderr, so `docker logs` shows it.
logfile =
pidfile =
